{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "task.fullname" . }}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-stg
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-stg
                port:
                  number: 8000
{{- end }}