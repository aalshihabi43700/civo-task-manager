name: Certificate Expiry Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

jobs:
  certificate-expiry-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes access
        shell: bash
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CIVO }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Check certificate expiry
        shell: pwsh
        run: ./scripts/check-cert-expiry.ps1


      - name: Send Teams test notification
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          $body = @{
            type = "message"
            attachments = @(
              @{
                contentType = "application/vnd.microsoft.card.adaptive"
                content = @{
                  type = "AdaptiveCard"
                  version = "1.4"
                  body = @(
                    @{
                      type = "TextBlock"
                      size = "Medium"
                      weight = "Bolder"
                      text = "Certificate Monitoring Test"
                    },
                    @{
                      type = "TextBlock"
                      text = "GitHub Actions successfully connected to Microsoft Teams."
                      wrap = $true
                    }
                  )
                }
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod `
            -Uri $env:TEAMS_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body