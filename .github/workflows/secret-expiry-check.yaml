name: Secret Expiry Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"   # 9:00 AM Saudi time

jobs:
  secret-expiry-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes access
        shell: bash
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CIVO }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Check secret expiry
        id: secretcheck
        shell: pwsh
        run: ./scripts/check-secret-expiry.ps1

      - name: Send Teams secret expiry alert
        if: always() && steps.secretcheck.outputs.needs_alert == 'true'
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          $body = @{
            type = "message"
            attachments = @(
              @{
                contentType = "application/vnd.microsoft.card.adaptive"
                content = @{
                  type = "AdaptiveCard"
                  version = "1.4"
                  body = @(
                    @{
                      type = "TextBlock"
                      size = "Medium"
                      weight = "Bolder"
                      text = "Secret Expiry Alert"
                    },
                    @{
                      type = "TextBlock"
                      text = "One or more Kubernetes secrets are approaching expiry. Check the Secret Expiry Check workflow for details."
                      wrap = $true
                    }
                  )
                }
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod `
            -Uri $env:TEAMS_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body